name: Publish WhatsApp edge image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mentorian-install
    paths:
      - gateway-edge/**
      - .github/workflows/publish-gateway-edge.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./gateway-edge
          push: true
          tags: ghcr.io/sergiomentorian/whatsapp-gateway-edge:stable
          labels: |
            org.opencontainers.image.source=https://github.com/sergiomentorian/wahub

