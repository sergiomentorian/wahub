name: Publish stable WAHA image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
      - codex/mentorian-install
      - codex/provider-health-dashboard-hub
    paths:
      - waha-noweb/**
      - .github/workflows/publish-waha-stable.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Select official stable release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error https://api.github.com/repos/devlikeapro/waha/releases/latest)"
          version="$(python3 -c 'import json,sys,re; r=json.loads(sys.argv[1]); v=str(r.get("tag_name", "")).removeprefix("v"); assert not r.get("draft") and not r.get("prerelease") and re.fullmatch(r"[0-9]{4}\.[0-9]+\.[0-9]+", v); print(v)' "$release_json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./waha-noweb/Dockerfile
          build-args: |
            WAHA_BASE_IMAGE=devlikeapro/waha:noweb-${{ steps.release.outputs.version }}
          push: true
          tags: |
            ghcr.io/sergiomentorian/waha-noweb:${{ steps.release.outputs.version }}-baileys-rc14
            ghcr.io/sergiomentorian/waha-noweb:stable-baileys-rc14
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/sergiomentorian/wahub
