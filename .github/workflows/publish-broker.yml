name: Publish broker image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mentorian-install
    paths:
      - broker/**
      - .github/workflows/publish-broker.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./broker
          push: true
          tags: |
            ghcr.io/sergiomentorian/wahub-broker:${{ github.sha }}
            ghcr.io/sergiomentorian/wahub-broker:stable
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/sergiomentorian/wahub
